  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 fill=\"#0B3A98\"><\u002Fcircle><circle cx=\"210\" cy=\"210\" r=\"140\" fill=\"none\" stroke=\"#56ABF1\" stroke-width=\"3\"><\u002Fcircle><circle cx=\"330\" cy=\"330\" r=\"14\" fill=\"#56ABF1\"><\u002Fcircle><\u002Fsvg>\n<div style=\"max-width:1120px;margin:0 auto;padding:28px 32px 88px;position:relative\">\n<nav style=\"display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px\">\n<span style=\"font-family:'Sora',sans-serif;font-weight:700;letter-spacing:.12em\">DIEGO TORRES<\u002Fspan>\n<span style=\"display:flex;gap:24px;flex-wrap:wrap\"><a href=\"#projets\" style=\"color:#fff;text-decoration:none\">Projets<\u002Fa><a href=\"#competences\" style=\"color:#fff;text-decoration:none\">Compétences<\u002Fa><a href=\"#parcours\" style=\"color:#fff;text-decoration:none\">Parcours<\u002Fa><a href=\"#contact\" style=\"color:#fff;text-decoration:none\">Contact<\u002Fa><\u002Fspan>\n<\u002Fnav>\n<div style=\"margin-top:84px;max-width:680px\">\n<p style=\"margin:0 0 12px;color:#9CC9F5;font-weight:700;letter-spacing:.1em;font-size:14px\">DATA SCIENTIST · AI ENGINEER<\u002Fp>\n<h1 style=\"font-family:'Sora',sans-serif;font-size:54px;line-height:1.1;margin:0 0 20px\">Je transforme la donnée en outils utilisés par les équipes métier.<\u002Fh1>\n<p style=\"font-size:18px;margin:0 0 32px;color:#DCEBFA\">Diplômé d'un Master Big Data &amp; Intelligence Artificielle (ESTIAM). Modèles prédictifs, API, dashboards et applications LLM / RAG, de l'analyse du besoin au déploiement.<\u002Fp>\n<div style=\"display:flex;gap:14px;flex-wrap:wrap\">\n<a href=\"mailto:dieg.torres64@gmail.com\" style=\"background:#56ABF1;color:#002A7E;font-weight:700;padding:14px 26px;border-radius:999px;text-decoration:none\">Me contacter<\u002Fa>\n<a href=\"#projets\" style=\"border:2px solid #56ABF1;color:#fff;font-weight:700;padding:12px 26px;border-radius:999px;text-decoration:none\">Voir mes projets<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fheader>\n\n<main style=\"max-width:1120px;margin:0 auto;padding:0 32px\">\n\n<section id=\"projets\" style=\"padding:72px 0 24px\">\n<p style=\"margin:0;color:#1F5FBF;font-weight:700;letter-spacing:.1em;font-size:14px\">RÉALISATIONS<\u002Fp>\n<h2 style=\"font-family:'Sora',sans-serif;font-size:34px;color:#002A7E;margin:4px 0 32px\">Projets<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(480px,1fr));gap:24px\">\n\n<article style=\"background:#fff;border:1px solid #D6E6F7;border-radius:16px;padding:28px\">\n<p style=\"margin:0;color:#1F5FBF;font-weight:700;font-size:14px\">01 · MACHINE LEARNING<\u002Fp>\n<h3 style=\"font-family:'Sora',sans-serif;font-size:22px;color:#002A7E;margin:6px 0 12px\">Prédiction de transformation de devis<\u002Fh3>\n<p style=\"margin:0 0 10px\"><strong>Problème.<\u002Fstrong> Estimer la probabilité qu'un devis commercial soit transformé, pour aider les équipes à prioriser.<\u002Fp>\n<p style=\"margin:0 0 10px\"><strong>Approche.<\u002Fstrong> Analyse des données historiques, feature engineering, comparaison de plusieurs algorithmes, optimisation des hyperparamètres, gestion du déséquilibre des classes.<\u002Fp>\n<p style=\"margin:0 0 10px\"><strong>Résultat.<\u002Fstrong> Évaluation par AUC, accuracy et matrice de confusion, analyse des faux positifs / négatifs, modèle exposé via un endpoint FastAPI. [AUC obtenue : à compléter]<\u002Fp>\n<p style=\"margin:16px 0 0;display:flex;gap:8px;flex-wrap:wrap\"><span style=\"background:#EAF4FD;color:#002A7E;padding:4px 12px;border-radius:999px;font-size:14px\">Python<\u002Fspan><span style=\"background:#EAF4FD;color:#002A7E;padding:4px 12px;border-radius:999px;font-size:14px\">Scikit-learn<\u002Fspan><span style=\"background:#EAF4FD;color:#002A7E;padding:4px 12px;border-radius:999px;font-size:14px\">LightGBM<\u002Fspan><span style=\"background:#EAF4FD;color:#002A7E;padding:4px 12px;border-radius:999px;font-size:14px\">FastAPI<\u002Fspan><span style=\"background:#EAF4FD;color:#002A7E;padding:4px 12px;border-radius:999px;font-size:14px\">SQL<\u002Fspan><\u002Fp>\n<p style=\"margin:16px 0 0;font-size:14px;color:#4A5568\">Code : [lien GitHub à ajouter] · Démo : [lien à ajouter]<\u002Fp>\n<\u002Farticle>\n\n<article style=\"background:#fff;border:1px solid #D6E6F7;border-radius:16px;padding:28px\">\n<p style=\"margin:0;color:#1F5FBF;font-weight:700;font-size:14px\">02 · IA GÉNÉRATIVE<\u002Fp>\n<h3 style=\"font-family:'Sora',sans-serif;font-size:22px;color:#002A7E;margin:6px 0 12px\">Assistant LLM avec architecture RAG<\u002Fh3>\n<p style=\"margin:0 0 10px\"><strong>Problème.<\u002Fstrong> Faire répondre un modèle de langage à partir de documents précis plutôt que de sa seule mémoire.<\u002Fp>\n<p style=\"margin:0 0 10px\"><strong>Approche.<\u002Fstrong> Embeddings et recherche sémantique, vector database, structuration des contextes transmis au LLM, prompt engineering, modèles via API et open source en local.<\u002Fp>\n<p style=\"margin:0 0 10px\"><strong>Résultat.<\u002Fstrong> API Python permettant d'intégrer le modèle dans une application, et expérimentation d'agents IA et de workflows automatisés. [Jeu de documents et démo : à compléter]<\u002Fp>\n<p style=\"margin:16px 0 0;display:flex;gap:8px;flex-wrap:wrap\"><span style=\"background:#EAF4FD;color:#002A7E;padding:4px 12px;border-radius:999px;font-size:14px\">LangChain<\u002Fspan><span style=\"background:#EAF4FD;color:#002A7E;padding:4px 12px;border-radius:999px;font-size:14px\">LlamaIndex<\u002Fspan><span style=\"background:#EAF4FD;color:#002A7E;padding:4px 12px;border-radius:999px;font-size:14px\">FastAPI<\u002Fspan><span style=\"background:#EAF4FD;color:#002A7E;padding:4px 12px;border-radius:999px;font-size:14px\">Docker<\u002Fspan><\u002Fp>\n<p style=\"margin:16px 0 0;font-size:14px;color:#4A5568\">Code : [lien GitHub à ajouter] · Démo : [lien à ajouter]<\u002Fp>\n<\u002Farticle>\n\n<article style=\"background:#fff;border:1px solid #D6E6F7;border-radius:16px;padding:28px\">\n<p style=\"margin:0;color:#1F5FBF;font-weight:700;font-size:14px\">03 · BUSINESS INTELLIGENCE<\u002Fp>\n<h3 style=\"font-family:'Sora',sans-serif;font-size:22px;color:#002A7E;margin:6px 0 12px\">Dashboards décisionnels Power BI<\u002Fh3>\n<p style=\"margin:0 0 10px\"><strong>Problème.<\u002Fstrong> Donner aux équipes un suivi clair de leurs indicateurs pour décider plus vite.<\u002Fp>\n<p style=\"margin:0 0 10px\"><strong>Approche.<\u002Fstrong> Préparation et nettoyage des données avec Pandas et SQL, conception des indicateurs, automatisation du traitement.<\u002Fp>\n<p style=\"margin:0 0 10px\"><strong>Résultat.<\u002Fstrong> Reportings utilisés pour le suivi et l'aide à la décision. [Capture d'un dashboard anonymisé : à ajouter]<\u002Fp>\n<p style=\"margin:16px 0 0;display:flex;gap:8px;flex-wrap:wrap\"><span style=\"background:#EAF4FD;color:#002A7E;padding:4px 12px;border-radius:999px;font-size:14px\">Power BI<\u002Fspan><span style=\"background:#EAF4FD;color:#002A7E;padding:4px 12px;border-radius:999px;font-size:14px\">Pandas<\u002Fspan><span style=\"background:#EAF4FD;color:#002A7E;padding:4px 12px;border-radius:999px;font-size:14px\">SQL<\u002Fspan><\u002Fp>\n<\u002Farticle>\n\n<article style=\"background:#fff;border:1px solid #D6E6F7;border-radius:16px;padding:28px\">\n<p style=\"margin:0;color:#1F5FBF;font-weight:700;font-size:14px\">04 · DÉVELOPPEMENT FULL STACK<\u002Fp>\n<h3 style=\"font-family:'Sora',sans-serif;font-size:22px;color:#002A7E;margin:6px 0 12px\">Tilkeo, CRM / ERP du groupe DS Group<\u002Fh3>\n<p style=\"margin:0 0 10px\"><strong>Problème.<\u002Fstrong> Relier toutes les sous-entreprises du groupe sur un même logiciel, puis l'ouvrir à des entreprises externes.<\u002Fp>\n<p style=\"margin:0 0 10px\"><strong>Approche.<\u002Fstrong> Back-end Django / Python avec MySQL, front-end Vue.js, travail en alternance avec les équipes (GitHub, Trello).<\u002Fp>\n<p style=\"margin:0 0 10px\"><strong>Résultat.<\u002Fstrong> Modules livrés : Tik'aide (montants d'aides MPR / CEE), annuaires, gestion des historiques de prix fournisseurs.<\u002Fp>\n<p style=\"margin:16px 0 0;display:flex;gap:8px;flex-wrap:wrap\"><span style=\"background:#EAF4FD;color:#002A7E;padding:4px 12px;border-radius:999px;font-size:14px\">Django<\u002Fspan><span style=\"background:#EAF4FD;color:#002A7E;padding:4px 12px;border-radius:999px;font-size:14px\">Vue.js<\u002Fspan><span style=\"background:#EAF4FD;color:#002A7E;padding:4px 12px;border-radius:999px;font-size:14px\">MySQL<\u002Fspan><span style=\"background:#EAF4FD;color:#002A7E;padding:4px 12px;border-radius:999px;font-size:14px\">GitHub<\u002Fspan><\u002Fp>\n<p style=\"margin:16px 0 0;font-size:14px;color:#4A5568\">Projet interne : captures publiées seulement avec l'accord de l'entreprise.<\u002Fp>\n<\u002Farticle>\n\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"competences\" style=\"padding:56px 0 24px\">\n<p style=\"margin:0;color:#1F5FBF;font-weight:700;letter-spacing:.1em;font-size:14px\">STACK<\u002Fp>\n<h2 style=\"font-family:'Sora',sans-serif;font-size:34px;color:#002A7E;margin:4px 0 28px\">Compétences<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px\">\n<div style=\"background:#fff;border:1px solid #D6E6F7;border-radius:14px;padding:22px\"><h3 style=\"font-family:'Sora',sans-serif;font-size:17px;color:#002A7E;margin:0 0 8px\">Data Science &amp; IA<\u002Fh3><p style=\"margin:0;color:#334155\">Python, Pandas, NumPy, Scikit-learn, régressions, arbres de décision, random forest, k-means, NLP, LLM, RAG<\u002Fp><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #D6E6F7;border-radius:14px;padding:22px\"><h3 style=\"font-family:'Sora',sans-serif;font-size:17px;color:#002A7E;margin:0 0 8px\">Big Data &amp; Data Engineering<\u002Fh3><p style=\"margin:0;color:#334155\">Hadoop, Spark, Scala, Kafka, Databricks Lakehouse, ETL, DataOps, ELK<\u002Fp><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #D6E6F7;border-radius:14px;padding:22px\"><h3 style=\"font-family:'Sora',sans-serif;font-size:17px;color:#002A7E;margin:0 0 8px\">BI &amp; Dataviz<\u002Fh3><p style=\"margin:0;color:#334155\">Power BI, Seaborn, Matplotlib, Dataviz, BI Programming (Python, R), reporting<\u002Fp><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #D6E6F7;border-radius:14px;padding:22px\"><h3 style=\"font-family:'Sora',sans-serif;font-size:17px;color:#002A7E;margin:0 0 8px\">Développement<\u002Fh3><p style=\"margin:0;color:#334155\">Django, FastAPI, Vue.js, React.js, Node.js, JavaScript, SQL, MySQL, MongoDB<\u002Fp><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #D6E6F7;border-radius:14px;padding:22px\"><h3 style=\"font-family:'Sora',sans-serif;font-size:17px;color:#002A7E;margin:0 0 8px\">Méthodes &amp; outils<\u002Fh3><p style=\"margin:0;color:#334155\">Scrum, gestion de projet, GitHub, Trello, Azure DevOps, hackathons<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"parcours\" style=\"padding:56px 0 24px\">\n<p style=\"margin:0;color:#1F5FBF;font-weight:700;letter-spacing:.1em;font-size:14px\">EXPÉRIENCE &amp; FORMATION<\u002Fp>\n<h2 style=\"font-family:'Sora',sans-serif;font-size:34px;color:#002A7E;margin:4px 0 28px\">Parcours<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(480px,1fr));gap:32px\">\n<div>\n<h3 style=\"font-family:'Sora',sans-serif;font-size:18px;color:#002A7E;margin:0 0 14px\">Expérience<\u002Fh3>\n<p style=\"margin:0 0 14px\"><strong>Chef de projet IA, TC Concept<\u002Fstrong> · 2024 – 2025<br>Algorithme d'optimisation des marges des devis, dashboards Power BI, collaboration avec la comptabilité et la data governance. <em>Apport : une vision business de la Data Science.<\u002Fem><\u002Fp>\n<p style=\"margin:0 0 14px\"><strong>Développeur Full Stack, Green Dev (Tilkeo)<\u002Fstrong> · 2022 – 2023, alternance<br>Interfaces dynamiques, fonctionnalités métiers sur mesure, méthode Agile avec Trello. <em>Apport : des solutions complètes, de la base de données à l'interface.<\u002Fem><\u002Fp>\n<p style=\"margin:0\"><strong>Développeur Web, BAE360 / ERP CRM Experts<\u002Fstrong> · 2021 – 2022, alternance<br>Personnalisation d'ERP en JavaScript, import / export de gros volumes de données, Azure DevOps et NetSuite. <em>Apport : l'industrialisation des outils et la rigueur.<\u002Fem><\u002Fp>\n<\u002Fdiv>\n<div>\n<h3 style=\"font-family:'Sora',sans-serif;font-size:18px;color:#002A7E;margin:0 0 14px\">Formation<\u002Fh3>\n<p style=\"margin:0 0 14px\"><strong>Master Big Data &amp; Intelligence Artificielle<\u002Fstrong>, ESTIAM, Lyon<br>2023 – 2025<\u002Fp>\n<p style=\"margin:0\"><strong>Licence Informatique Générale<\u002Fstrong>, CNAM<br>2020 – 2023<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"contact\" style=\"padding:56px 0 72px\">\n<div style=\"background:#002A7E;color:#fff;border-radius:20px;padding:44px 40px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap\">\n<div style=\"max-width:560px\">\n<h2 style=\"font-family:'Sora',sans-serif;font-size:30px;margin:0 0 10px\">Un projet Data ou IA à construire ?<\u002Fh2>\n<p style=\"margin:0;color:#DCEBFA\">Objectif : évoluer vers Data Scientist senior ou Data Engineer. Basé à Bidart, mobilité Pays Basque / Bordeaux, télétravail possible. Disponible immédiatement.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;gap:14px;flex-wrap:wrap\">\n<a href=\"mailto:dieg.torres64@gmail.com\" style=\"background:#56ABF1;color:#002A7E;font-weight:700;padding:14px 26px;border-radius:999px;text-decoration:none\">dieg.torres64@gmail.com<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:18px 0 0;font-size:14px;color:#4A5568\">GitHub : [lien à ajouter] · LinkedIn : [lien à ajouter]<\u002Fp>\n<\u002Fsection>\n\n<\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:2900}}\">\nclass Component extends DCLogic {\nrenderVals()
